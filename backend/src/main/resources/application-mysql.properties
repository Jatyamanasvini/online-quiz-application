# MySQL profile. Activate with: --spring.profiles.active=mysql
# Credentials come from the environment, never from this file.
#   DB_URL, DB_USERNAME, DB_PASSWORD
#
# Local MySQL (no TLS):
#   DB_URL=jdbc:mysql://127.0.0.1:3306/quizdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# Aiven / any managed MySQL (TLS required):
#   DB_URL=jdbc:mysql://HOST:PORT/defaultdb?ssl-mode=REQUIRED&serverTimezone=UTC
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/quizdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:quizapp}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Aiven closes idle connections; validate before handing them to Hibernate.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.validation-timeout=5000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=false
