spring.application.name=quiz-platform
server.port=8080

# Default local profile: file-based H2 so the app runs with zero setup.
# Data survives restarts in ./data/quizdb.mv.db
spring.datasource.url=jdbc:h2:file:./data/quizdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Local-only database console: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
