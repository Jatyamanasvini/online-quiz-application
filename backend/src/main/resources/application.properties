spring.application.name=quiz-platform
# Render (and most PaaS hosts) inject PORT; locally this falls back to 8080.
server.port=${PORT:8080}

# Comma-separated browser origins allowed to call the API. In production set this to the
# Vercel URL, e.g. CORS_ALLOWED_ORIGINS=https://quizora.vercel.app,https://*.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT signing key. MUST be overridden on a public deployment (48+ characters for HS384).
app.jwt.secret=${JWT_SECRET:dev-only-quizora-secret-change-me-for-production-use-0123456789}
app.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:480}

# Demo accounts created only when the user table is empty. On a public deployment set
# these before the first start; the seeder never updates an existing account.
app.seed.teacher-email=${SEED_TEACHER_EMAIL:teacher@quizora.local}
app.seed.teacher-name=${SEED_TEACHER_NAME:Prof. Meera Rao}
app.seed.teacher-password=${SEED_TEACHER_PASSWORD:teacher123}
app.seed.student-email=${SEED_STUDENT_EMAIL:student@quizora.local}
app.seed.student-name=${SEED_STUDENT_NAME:Demo Student}
app.seed.student-password=${SEED_STUDENT_PASSWORD:student123}

# Default local profile: file-based H2 so the app runs with zero setup.
# Data survives restarts in ./data/quizdb.mv.db
spring.datasource.url=jdbc:h2:file:./data/quizdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Local-only database console: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
